kind = "mobile"
previewPath = "/"
title = "FormReady: Photo & PDF Tools"
description = "A polished offline-first Android utility app for Indian students and job applicants to resize, compress, convert, and prepare photos, signatures, and PDFs for online forms."
version = "1.0.0"
id = "artifacts/formready"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23668

[services.development]
run = "pnpm --filter @workspace/formready run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/formready", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/formready", "run", "serve" ]

[services.env]
PORT = "23668"
BASE_PATH = "/"
